server {
    listen 8030;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 静态资源长缓存（Vite 带 hash 文件名，immutable 安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → backend（管理后台 API 已并入业务 backend，路由 /api/v1/admin/*）
    # 管理域名只放行后台接口；业务接口走主站域名，这里不暴露
    location ^~ /api/v1/admin/ {
        client_max_body_size 500M;

        proxy_pass http://backend:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        return 404;
    }

    # SPA fallback —— Vite 是 SPA，无 trailing-slash 目录结构
    # 任何前端路由（如 /admin/dashboard、/admin/users）找不到静态文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
